      <template><p><a href="https://www.france.tv/societe/magazine-d-actualites/une-vie-en-france/" target="_blank">watch it here</a>.<br><br>A one-minute biographical series portraying figures whose lives reshaped France through migration, created using emerging digital production tools using a digital oil painting aesthetic.<br><br>I directed the episodes dedicated to <a href="https://www.france.tv/societe/magazine-d-actualites/une-vie-en-france/8668026-moustaki.html" target="_blank">Georges Moustaki</a>, <a href="https://www.france.tv/societe/magazine-d-actualites/une-vie-en-france/8633069-kenzo.html" target="_blank">Kenzo Takada</a>, and <a href="https://www.france.tv/societe/magazine-d-actualites/une-vie-en-france/8641761-kamel-daoud.html" target="_blank">Kamel Daoud</a>. Starting from the voice over, I developed the visual narrative through historical research, story adaptation, image direction, editing, and sound design.<br><br>These stories are about people who crossed borders. They also belong to a moment when images themselves crossed into an economy that valued their price over their making.<br><br>Produced by Cinétévé and Atlas V for national broadcast France Télévisions. First aired on July 12, 2026.</p></template>
    </a>
    <a class="tile" href="/work/failing-forward/"

        <source type="image/webp" srcset="/assets/img/failing-forward-480.webp 480w, /assets/img/failing-forward-960.webp 960w, /assets/img/failing-forward-1600.webp 1600w" sizes="(max-width: 740px) 31vw, 26vw">
        <img src="/assets/img/failing-forward-960.jpg" alt="FAILING FORWARD — short fiction film, 2024" width="1122" height="1122" loading="lazy" decoding="async">
      </picture>
      <template><p><a href="https://www.arte.tv/fr/videos/129320-000-A/failing-forward/" target="_blank">watch it her</a><a href="https://www.instagram.com/failing.fwd/" target="_blank">e</a></p><p>After being told she sounds like LaMDA, Google’s language model, Rony returns to the conversations published by The Washington Post to find out what, exactly, the two of them have in common. Played by the filmmaker whose name she carries, she consults the evidence and watches her story change shape around it.</p><p>Through live action, personal archives and the now-extinct visual language of early generative AI, Failing Forward captures a brief technological moment before the images learned to behave.</p><p>With Rony Efrat, Max Cooper<br>Director, original screenplay and video editing: Rony Efrat<br>Animation: Ran Bensimon<br>3D: Miguel Pascual<br>DOP: Eyal Bau Cohen<br>Sound: Geoffrey Durcak<br>Original Score: Avshalom Hasfari<br>Executive Producer: Hannah Meholick</p><p>Produced at Le Fresnoy – Studio national des arts contemporains<br>Recipient of the 2024 ADAGP Digital Art Revelation Award<br>Selected for L'Étrange Festival and Interfilm Berlin (2025)<br>Broadcast by ARTE in 2026</p></template>

      <template><p><a href="https://fawesome.tv/movies/10556569/exemplaires" target="_blank">watch it here</a>.</p><p>Paris, winter 2017. Three female migrants face the arbitrary cancellation on their 2006 resident permit for “exceptional talents”. Suddenly stripped of any legal possibility of remaining in the territory, they seek equally exceptional solutions to maintain their lives as they are.</p><p>With Elena Sukhanakova, Kaori Ito, Vincent Rouquès, Antoine Hirel, Elise Arpentinier, Lucie Reinaudo, Alexandre Risso, Fabien Terreng.</p><p>Director, original screenplay and video editing: Rony Efrat<br>DOP: Sarah Blum<br>Sound: Valentine Gelin<br>Original Score: Avshalom Hasfari</p><p>Produced at Le Fresnoy - Studio national des arts contemporains.<br><br>Selections:<br>2023 Honorable mention - Underdog Film Festival Wolfsburg<br>2023 International Migration &amp; Environmental Film Festival<br>2022 Honorable mention -<br>Imagine This Women’s Film Festival<br>2022<br>IMPACTE! Human Rights Film Festival of Catalonia<br>2022 GO SHORT Film Festival<br>2022 Un poing c'est court, le Festival du Film Court Francophone<br>2022 Festival des Arènes de Montmartre<br>2022 Clermont Ferrand Short Film Market Picks<br>2021 Girogirocorto à l'Institut français de Rome</p></template>

      <template><p><a href="https://www.ecole3a.edu/actualites/retour-en-image-sur-deux-conferences-incontournables-a-3-a-paris" target="_blank">find it here</a>.</p><p>A talk for researchers, policymakers, administrators, artists, communities, and anyone curious about how AI reshapes memory, storytelling, governance, and, most importantly, care.</p><p>First presented on February 14, 2025, at 3A Paris during the roundtable The Impact of AI on the Social and Solidarity Economy, Tech, Care has continued to evolve through invitations from institutions and universities, including the 2026 Euro-American Summit organized by TransAtlantic Sciences Po and the Harvard Undergraduate Foreign Policy Initiative (HUFPI).</p><p>The talk draws on my own practice, as well as the researchers and thinkers I teach in my two Sciences Po courses. Together, they explore how AI challenges the boundary between memory and reconstruction, and how it reshapes the way we understand technology. I also argue that regulation is only one layer: private company policies and system design often determine what is actually possible long before legislation catches up.</p><p>Tech, Care invites audiences to think less about AI as a tool and more about the systems and languages that shape it. This isn’t a history class, and it certainly isn’t a frontal lecture. It’s a place to exchange ideas, try things, and fail without pretending otherwise.</p><p>The talk is available in English and French.</p></template>
    </a>

      <template><p><a href="https://www.instagram.com/reel/DQq-VzsDEYM/?utm_source=ig_web_copy_link&amp;igsh=MzRlODBiNWFlZA==" target="_blank">find it here</a>.</p><p>A multi-screen installation about memory, technology, states, and family.<br><br>In this work, I interview my parents in front of a green screen, asking them to recall fragments of their lives. Their voices and gestures are then transformed through AI, archival images, and old photographs.<br><br>The result is a hybrid space where truth and fiction merge, a tragicomic portrait of memory itself, constantly rewritten by technology.<br><br>Alongside the video installation, the exhibition includes personal writings, theoretical references, and two interactive AI applications that questions how stories are remembered, distorted, or lost.<br><br>Opened on October 29, 2025 at the ADAGP in Paris, and ran until December 4, 2025.</p></template>

    <a class="tile" href="/work/from-accents-to-ai/"
       data-slug="from-accents-to-ai"
       data-title="FROM ACCENTS TO AI — On the impact of standardization on identity and linguistic nostalgia"
       data-subtitle="talk, 2023"
       data-full="/assets/img/from-accents-to-ai-960.jpg"
       data-fullset="/assets/img/from-accents-to-ai-480.webp 480w, /assets/img/from-accents-to-ai-960.webp 960w, /assets/img/from-accents-to-ai-1600.webp 1600w"
       aria-label="FROM ACCENTS TO AI — On the impact of standardization on identity and linguistic nostalgia, talk, 2023">
      <picture>
        <source type="image/webp" srcset="/assets/img/from-accents-to-ai-480.webp 480w, /assets/img/from-accents-to-ai-960.webp 960w, /assets/img/from-accents-to-ai-1600.webp 1600w" sizes="(max-width: 740px) 31vw, 26vw">
        <img src="/assets/img/from-accents-to-ai-960.jpg" alt="FROM ACCENTS TO AI — On the impact of standardization on identity and linguistic nostalgia — talk, 2023" width="1536" height="1535" loading="lazy" decoding="async">
      </picture>
      <template><p><a href="https://www.youtube.com/watch?v=jHXkzs6yE9w" target="_blank">find it here</a>.</p><p>Clusters: Technoculture, Art &amp; Games<br />A symposium at <a href="https://milieux.concordia.ca/" target="_blank">Milieux Institute</a>, Concordia University, that explores creative nostalgia through panel discussions and workshops from experts in the arts and sciences.<br /><br />Abstract:</p><p>Increasing mobility, technology and changes in globalized society have made nostalgia a more typical experience for many, through multilingual communication. Speaking multiple languages blurs the boundaries between the languages we were born with and the adopted ones, sometimes on a daily basis. Some elements in language proficiency evoke nostalgia, for example, sound associations that lie in sensory memory, chief among them is an accent: a rough hint of the existence of another language in the mouth of the speaker, a hint of the past.<br /><br />Perhaps this is nostalgia: a new, more diverse orality compiled into our sensory database. Many digital tools produced in recent years use this premise, trying to detect as many forms of pronunciation as possible. What does multilingual oral expression tell us about our identity, past and future, and what is the place of speech-harmonizing digital tools in a world where the identity of the speaker is woven through oral personalization?<br /></p></template>
    </a>

      <template><p><a href="https://vimeo.com/278127940" target="_blank">find it here</a>.</p><p>Throughout the winter of 2018, IGLO&Ugrave; prepared a new edition under the name Escales Li&eacute;es, bringing together artists from diverse artistic and geographical backgrounds. This edition was developed in collaboration with the architecture agency Encore Heureux, curators of the French Pavilion at the 16th Venice Architecture Biennale. The theme of &ldquo;interval&rdquo; served as the foundation for this interdisciplinary project, exploring the spaces between moments, ideas, and geographies through a variety of artistic mediums.<br /><br />As part of Escales Li&eacute;es, five curated IGLO&Ugrave; projects took residence in the Caserma Pepe space, a former military barracks on Lido Island, during June 2018. These projects, which spanned video, sound, and interactive installations, were open to the public and culminated in a cohesive, cross-disciplinary artistic journey. This journey was later showcased in La Villette Park, Paris, providing visitors with an immersive experience that transcended both time and space.<br /><br />The highlight of this showcase was a 24-hour artistic event, where visitors experienced a sleepless night full of performances, interactive video, and sound installations. This event created a dynamic dialogue between Paris and Venice, using digital technologies to explore the concept of &ldquo;interval&rdquo; in a way that bridged artistic disciplines and geographies.&nbsp;<br /><br />Curator: Rony Efrat<br />Administrative Director: Alexandra Beraldin<br />IGLO&Ugrave; Members: Elena Sukhanakova, Nicolas Lefebvre, M&eacute;lie N&eacute;el, Yuka Dupleix, Aude Muirage, Luna Scolari</p></template>

      <template><p><a href="https://vimeo.com/225368439" target="_blank">find it here</a>.</p><p>IGLO&Ugrave;&rsquo;s second annual event invited visitors on a weekend-long digital and multisensory journey at DOC, a former high school turned artist

      </picture>
      <template><p>A series of immersive audio guides for the Louvre Museum, blending
dramatic soundscapes with experimental sound and localization technologies. As
visitors passed by statues in the Cour Marly room, the audio guides were
automatically triggered through special beacons, offering site-specific
soundscapes and narratives.<br /><br />The project was scripted by nine female theater directors,
crafting audio dramas inspired by the historical and mythological backgrounds
of the works. Using personal mobile devices, visitors experienced a
multi-sensory, digitally-mediated tour, demonstrating how technology can
enhance public interaction with cultural artifacts and reimagine museum spaces.</p><p>Led by Linda Duskova and Lucas Leli&egrave;vre<br />Provided by IDEFI-Cr&eacute;aTIC Laboratory<br />Created by Rhym Amich, Caroline Avril, Elodie Derlyn, Rony Efrat, Justine Louvel, Marion Solange Malenfant, Leslie Menahem and Elena Sukhanakova.</p></template>

      <template><p><a href="https://vimeo.com/171113603" target="_blank">find it here</a>.</p><p>In this
interactive Exquisite Corpse performance, participants submit personal
memories, which are then translated using homophonic translation software into
multiple languages. These translations are combined with digitally sampled

      <template><p>Ariel Abrahams and Rony Efrat write together but have not yet met in person. They created a long distance storytelling piece for bus passengers via text message, on the subjects of love, coincidence, and landscape. The narrative is constructed as a conversation between the two artists, who first meet on the bus. Participants will have the agency to reply all. Digital = Public = Landscape.<br /></p><p>First presented in March 2016 as part of Fung Wah Biennial at Flux Factory, between New York City, Boston, Philadelphia and Baltimore.</p><p> Find more articles about this project in the press section. </p></template>

      <template><p><a href="https://vimeo.com/156493768" target="_blank">find it here</a>.</p><p>False friends, or Faux-amis, is an expression describing two words in two different languages that look or sound similar, but differ significantly in meaning. When two stories meet, a new story is created. Told in different languages and played around, a fairy tale is created where borders are made of sweets and political realities become candy-flossed fantasies.<br /><br />Written and performed by Lilac Yosiphon and Rony Efrat<br />Sound by Alex Roven<br />Illustration by Niko Lefebvre</p><p>First presented in February 2016, at M&eacute;moire de l'Avenir Gallery, Paris, France.<br /><br />Find more articles about this project in the press section.</p></template>

      <template><p><a href="https://vimeo.com/113204333" target="_blank">find it here</a>.</p><p>A portrait of an imaginary family. Three attempts to reach a memory that might never happen, trapped in video, sound, and water. It is presented in English, Italian, and French, considering the incomprehension of at least one of the languages.<br /><i><br />Tra il Dire e il Fare</i> uses audio tools to explore the complexities of
translation, not only as a linguistic task but as a cultural and emotional
exchange shaped by technology. Three strangers, speaking in English, Italian,
and French, reflect on family photos that are not their own, blurring the lines
between personal and collective memory. Through the digital, speech and
dialogue are archived, creating a snapshot of a fleeting mental state. <br /></p><p>Devised and performed by Rony Efrat<br />Soundtrack by Avshalom Hasfari and Rony Efrat<br />Voice over by Francesco Perrone, Th&eacute;ophile Choquet and Andrew Baggaley</p><p>First performed in November 2014 at Palazzo C&agrave; Zanardi, Venice, Italy, as part of the International ArtExpo Festival for video art, experimental dance and performance.</p></template>

      <template><p><a href="https://vimeo.com/106001801" target="_blank">find it here</a>.</p><p><i>Home Check</i> is an interactive performance that
incorporates digital tools to create a virtual &ldquo;home visit&rdquo;
experience. The performance uses video mapping and digital questionnaires to
